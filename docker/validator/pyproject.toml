[project]
name = "oro-validator"
version = "0.0.0"
description = "ORO subnet validator dependencies"
requires-python = ">=3.11"
dependencies = [
    "async-substrate-interface==2.2.1",
    "bittensor==10.5.0",
    "bittensor-auth>=0.1.1",
    "bittensor-wallet==4.1.0",
    "fastapi>=0.115",
    "openai==2.44.0",
    "oro-env-runtime==1.0.6",
    "oro-sdk==1.0.121",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
    "py-spy>=0.4.1",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "requests==2.33.0",
    "sentence-transformers==5.3.0",
    "torch>=2.13.0,<3",
    "ujson==5.13.0",
    "uvicorn>=0.30",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
