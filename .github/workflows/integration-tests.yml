name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'docker/search-server/**'
      - 'docker/proxy/**'
      - 'docker/sandbox/**'
      - 'subnet/validator/session_registry.py'
      - 'subnet/validator/session_errors.py'
      - 'subnet/validator/session_service.py'
      - 'subnet/validator/environment_preflight*.py'
      - 'src/search_engine/**'
      - 'src/sandbox/**'
      - 'tests/integration/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build services
        run: |
          docker compose build search-server session-runtime proxy sandbox

      - name: Start search server
        run: |
          docker compose up -d search-server
          timeout 120 bash -c 'until docker compose ps search-server | grep -q "healthy"; do sleep 2; done' || true

      - name: Start proxy
        run: |
          docker compose up -d proxy
          timeout 60 bash -c 'until docker compose ps proxy | grep -q "healthy"; do sleep 2; done' || true

      - name: Start sandbox (persistent, test-mode)
        run: |
          docker compose up -d sandbox
          docker ps --filter name=shoppingbench-sandbox --format '{{.Names}} {{.Status}}'

      - name: Install test dependencies
        run: |
          python -m pip install --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install 'certifi>=2026.10.19' 'urllib3>=2.8.0' 'setuptools>=84.1.0' requests pytest

      - name: Run sandbox isolation tests
        run: |
          pytest tests/integration/test_sandbox_isolation.py -v --tb=short

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs --tail 50 search-server
          docker compose logs --tail 50 session-runtime
          docker compose logs --tail 50 proxy

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
