name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0.0 or latest)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/oro-ai/oro

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: determine-tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `search-server` is a source-only build on top of the pre-indexed
        # `search-server-base:latest`. That base carries the Lucene index +
        # its `documents_sha256` / `index_sha256` identity; this workflow
        # rebuilds only the code layer (entrypoint.sh, server.py, runtime
        # catalog helpers) so its output inherits the current base's
        # search identity byte-for-byte. The smoke-test job asserts that
        # invariant on every publish — see the "Smoke test search-server
        # image" step below for the identity guardrail that catches an
        # empty or missing index before the manifest lands (ORO-2244).
        image: [proxy, sandbox, validator, search-server]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: proxy
            file: docker/proxy/Dockerfile
          - image: sandbox
            file: docker/sandbox/Dockerfile
          - image: validator
            file: docker/validator/Dockerfile
          - image: search-server
            file: docker/search-server/Dockerfile
    steps:
      - name: Free disk space (search-server base image is ~7GB)
        if: matrix.image == 'search-server'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          secrets: |
            ${{ matrix.image == 'validator' && format('hf_token={0}', secrets.HF_TOKEN) || '' }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:cache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:cache-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # The search-server smoke step pulls the ~7GB indexed base image
      # (via the just-built digest) AND the current `:stable` digest for
      # identity comparison. The build job frees disk before pulling;
      # mirror that here so pulls don't fail with ENOSPC.
      - name: Free disk space (search-server pulls ~7GB baked-index images)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validator digest (amd64)
        uses: actions/download-artifact@v4
        with:
          name: digest-validator-linux-amd64
          path: /tmp/digests/validator

      - name: Download sandbox digest (amd64)
        uses: actions/download-artifact@v4
        with:
          name: digest-sandbox-linux-amd64
          path: /tmp/digests/sandbox

      - name: Download proxy digest (amd64)
        uses: actions/download-artifact@v4
        with:
          name: digest-proxy-linux-amd64
          path: /tmp/digests/proxy

      - name: Download search-server digest (amd64)
        uses: actions/download-artifact@v4
        with:
          name: digest-search-server-linux-amd64
          path: /tmp/digests/search-server

      # Use the baked-in venv at .venv/bin/python — the same interpreter the
      # ENTRYPOINT runs in production. Going through `uv run` instead would
      # re-resolve deps from pyproject.toml at exec time and silently install
      # anything missing from the image, hiding lockfile drift. v1.0.59 shipped
      # exactly that bug: psutil was added to pyproject.toml but uv.lock wasn't
      # regenerated, so `uv sync --frozen` skipped psutil at build time and
      # the validator ImportError'd at runtime.
      - name: Smoke test validator image
        run: |
          digest=$(ls /tmp/digests/validator | head -1)
          docker run --rm --entrypoint .venv/bin/python ${{ env.IMAGE_PREFIX }}/validator@sha256:$digest \
            -c "import subnet.validator.main; print('Validator module OK')"

      - name: Smoke test sandbox image
        run: |
          digest=$(ls /tmp/digests/sandbox | head -1)
          docker run --rm --entrypoint python ${{ env.IMAGE_PREFIX }}/sandbox@sha256:$digest \
            -c "import src.agent.agent_interface; print('Sandbox module OK')"

      # Boot the proxy with the same env vars that docker-compose.yml exports
      # to a real validator deploy. If a new ${VAR} is added to
      # nginx.conf.template without either (a) a default in the proxy
      # Dockerfile CMD or (b) a corresponding entry in docker-compose.yml,
      # envsubst writes empty, nginx fails with `[emerg] invalid number of
      # arguments`, and the container exits — failing this step before the
      # tag is published. Without this guard, v1.0.56 shipped that exact
      # regression to staging.
      - name: Smoke test proxy image
        run: |
          digest=$(ls /tmp/digests/proxy | head -1)
          docker run -d --name proxy-smoke \
            -e SEARCH_SERVER_URL=search-server \
            -e SEARCH_SERVER_PORT=5632 \
            -e CHUTES_HOST=llm.chutes.ai \
            ${{ env.IMAGE_PREFIX }}/proxy@sha256:$digest
          sleep 5
          state=$(docker inspect -f '{{.State.Status}}' proxy-smoke)
          if [ "$state" != "running" ]; then
            echo "::error::Proxy state is '$state' (expected 'running') — nginx config likely failed to render"
            docker logs proxy-smoke 2>&1 || true
            docker rm -f proxy-smoke 2>/dev/null || true
            exit 1
          fi
          echo "Proxy nginx config rendered and started cleanly"
          docker rm -f proxy-smoke

      # Boot the search-server on the same image contract miners run:
      # `/app/indexes` populated by the indexed base, gunicorn spawning +
      # /health returning `status: healthy` with a non-empty search
      # identity. #277 removed search-server from this workflow out of
      # (valid) concern that a source-only rebuild could publish an
      # image whose baked-in index drifted from the active pack. This
      # step is the guardrail that answers that concern in two parts:
      #
      # 1. Assert the fresh image's `/health` reports a healthy state +
      #    the expected contract + non-empty 64-char SHAs.
      # 2. Compare the fresh image's `documents_sha256` +
      #    `index_sha256` against the *currently-promoted* `:stable`
      #    image's identity. If they differ, the base advanced to a
      #    different indexed pack — this workflow refuses to promote
      #    it because only the private-fork pack-bound publish pipeline
      #    is authorized to change search identity. Fresh publishes of
      #    :stable in that case must go through that pipeline.
      #
      # Also verifies the sync-worker fix from ORO-2244 stays live:
      # greps the process command line for `--worker-class sync` so a
      # future entrypoint edit that reintroduces gthread trips CI.
      - name: Smoke test search-server image
        run: |
          set -euo pipefail

          # Poll a search-server container's /health until it returns.
          # Base image is ~7GB and cold JVM startup can take ~30s on the
          # runner; give up to ~120s. Echoes the JSON body on success,
          # empty on timeout. Caller checks for empty + inspects logs.
          wait_for_health() {
            local ctr="$1" body=""
            for _ in $(seq 1 40); do
              local state
              state=$(docker inspect -f '{{.State.Status}}' "$ctr" 2>/dev/null || echo missing)
              if [ "$state" != "running" ]; then
                echo "::error::search-server container $ctr exited early (state=$state)"
                docker logs "$ctr" 2>&1 || true
                docker rm -f "$ctr" 2>/dev/null || true
                return 1
              fi
              body=$(docker exec "$ctr" python -c 'import urllib.request, json; print(json.dumps(json.loads(urllib.request.urlopen("http://localhost:5632/health", timeout=3).read())))' 2>/dev/null || echo "")
              if [ -n "$body" ]; then
                printf '%s' "$body"
                return 0
              fi
              sleep 3
            done
            return 2
          }

          fresh_digest=$(ls /tmp/digests/search-server | head -1)
          docker run -d --name search-smoke \
            -e HOST=0.0.0.0 -e PORT=5632 \
            ${{ env.IMAGE_PREFIX }}/search-server@sha256:$fresh_digest
          if ! fresh_body=$(wait_for_health search-smoke); then
            echo "::error::search-server (fresh) /health never returned within 120s"
            docker logs search-smoke 2>&1 | tail -80 || true
            docker rm -f search-smoke 2>/dev/null || true
            exit 1
          fi
          echo "fresh /health:"
          echo "$fresh_body" | python3 -m json.tool

          # Probe :stable presence via `docker manifest inspect` and
          # distinguish "manifest absent" (legit skip on first publish)
          # from operational errors (transient GHCR / network / auth
          # blip). Operational errors MUST hard-fail — silently skipping
          # the drift compare would let a mismatched-index build reach
          # :latest and, via a later promote, :stable. The manifest
          # unknown detection is the whole point of this smoke step.
          stable_body=""
          manifest_stderr=$(mktemp)
          if docker manifest inspect \
              ${{ env.IMAGE_PREFIX }}/search-server:stable \
              >/dev/null 2>"$manifest_stderr"; then
            stable_present=1
          else
            manifest_msg=$(cat "$manifest_stderr")
            case "$manifest_msg" in
              *"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"no such manifest"*|*"not found"*|*"NAME_UNKNOWN"*)
                stable_present=0
                echo "::warning::search-server:stable not present in registry (manifest unknown) — skipping identity-drift comparison (first publish)"
                ;;
              *)
                echo "::error::search-server:stable presence probe failed with operational error — refusing to skip drift check"
                echo "$manifest_msg" >&2
                docker rm -f search-smoke 2>/dev/null || true
                rm -f "$manifest_stderr"
                exit 1
                ;;
            esac
          fi
          rm -f "$manifest_stderr"

          if [ "${stable_present:-0}" -eq 1 ]; then
            docker pull ${{ env.IMAGE_PREFIX }}/search-server:stable
            docker run -d --name stable-search-smoke \
              -e HOST=0.0.0.0 -e PORT=5632 \
              ${{ env.IMAGE_PREFIX }}/search-server:stable
            if ! stable_body=$(wait_for_health stable-search-smoke); then
              echo "::error::search-server:stable /health never returned within 120s (cannot compare identity)"
              docker logs stable-search-smoke 2>&1 | tail -80 || true
              docker rm -f stable-search-smoke search-smoke 2>/dev/null || true
              exit 1
            fi
            docker rm -f stable-search-smoke
          fi

          FRESH_BODY="$fresh_body" STABLE_BODY="$stable_body" python3 <<'PY'
          import json
          import os
          import sys

          fresh = json.loads(os.environ["FRESH_BODY"])
          errs = []
          if fresh.get("status") != "healthy":
              errs.append(f"status={fresh.get('status')!r} != healthy")
          search = fresh.get("search") or {}
          if search.get("index_contract") != "oro.lucene.catalog.v2":
              errs.append(f"index_contract={search.get('index_contract')!r}")
          for field in ("documents_sha256", "index_sha256"):
              value = search.get(field)
              if not (isinstance(value, str) and len(value) == 64):
                  errs.append(f"{field}={value!r} is not a 64-char hex SHA")
          if errs:
              print("Fresh /health rejected:", file=sys.stderr)
              for e in errs:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(f"search-server /health rejected: {len(errs)} issue(s)")
          print(f"fresh identity OK: documents={search['documents_sha256'][:12]} index={search['index_sha256'][:12]}")

          # Drift comparison against currently-promoted :stable (if any).
          stable_raw = os.environ.get("STABLE_BODY") or ""
          if not stable_raw:
              print("no :stable image to compare against; skipping drift check", file=sys.stderr)
              sys.exit(0)
          stable = json.loads(stable_raw)
          stable_search = stable.get("search") or {}
          drift = []
          for field in ("documents_sha256", "index_sha256"):
              if search.get(field) != stable_search.get(field):
                  drift.append(
                      f"{field}: fresh={search.get(field)!r} != stable={stable_search.get(field)!r}"
                  )
          if drift:
              print(
                  "Fresh build's search identity does not match the currently-promoted"
                  " :stable image. Only the private-fork pack-bound publish pipeline is"
                  " authorized to advance search identity; this code-only publish"
                  " workflow must not replace :stable with a different indexed pack.",
                  file=sys.stderr,
              )
              for line in drift:
                  print(f"  - {line}", file=sys.stderr)
              sys.exit("search identity drift blocked")
          print("identity matches currently-promoted :stable — safe to publish")
          PY

          # ORO-2244 guardrail: pyjnius / pyserini are not thread-safe. If
          # someone re-adds `--worker-class gthread --threads N` we want CI
          # to fail before miners get the buggy image again.
          cmdline=$(docker exec search-smoke sh -c 'cat /proc/1/cmdline | tr "\0" " "')
          echo "gunicorn cmdline: $cmdline"
          if ! echo "$cmdline" | grep -q -- '--worker-class sync'; then
            echo "::error::search-server is NOT using --worker-class sync (see ORO-2244)"
            docker rm -f search-smoke
            exit 1
          fi
          if echo "$cmdline" | grep -q -- '--threads'; then
            echo "::error::search-server is passing --threads (pyjnius races, see ORO-2244)"
            docker rm -f search-smoke
            exit 1
          fi

          docker rm -f search-smoke

  merge:
    needs: [determine-tag, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [proxy, sandbox, validator, search-server]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Create manifest and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.determine-tag.outputs.tag }} \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' $(ls /tmp/digests/))
